name: splitsecond

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-splitsecond}
  POSTGRES_USER: ${POSTGRES_USER:-splitsecond}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}

services:
  postgres:
    image: postgres:16
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only when the volume is empty; use `docker compose down -v` after schema changes.
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./docker/initdb/20-test-db.sh:/docker-entrypoint-initdb.d/20-test-db.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: splitsecond-api:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-splitsecond}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-splitsecond}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  test:
    image: splitsecond-api:dev
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./backend:/app/backend:ro
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-splitsecond}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: ["python", "-m", "unittest", "discover", "-s", "backend/tests", "-v"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
