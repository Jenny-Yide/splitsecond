name: splitsecond

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-splitsecond}
  POSTGRES_USER: ${POSTGRES_USER:-splitsecond}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}

# Same variable names as the backup-s3 Secret in Kubernetes.
x-s3-env: &s3-env
  AWS_ENDPOINT: http://seaweedfs:9000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-splitsecond}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-dev-secret}
  AWS_S3_FORCE_PATH_STYLE: "true"
  S3_BUCKET: splitsecond-backups
  WALG_S3_PREFIX: s3://splitsecond-backups/walg

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: splitsecond-postgres:dev
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=timeout 120 wal-g wal-push %p
      - -c
      - archive_timeout=300
    environment:
      <<: [*db-env, *s3-env]
    volumes:
      # The image applies schema.sql only when the volume is empty; use `docker compose down -v` after schema changes.
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb/20-test-db.sh:/docker-entrypoint-initdb.d/20-test-db.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      create-bucket:
        condition: service_completed_successfully

  base-backup:
    image: splitsecond-postgres:dev
    pull_policy: never
    command: ["/backup/base-backup.sh"]
    user: "999:999"
    environment:
      <<: *s3-env
      PGDATA: /var/lib/postgresql/data
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-splitsecond}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-splitsecond}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Kubernetes runs this daily as a CronJob; locally: docker compose --profile backup run --rm dump
  dump:
    image: splitsecond-postgres:dev
    pull_policy: never
    profiles: ["backup"]
    command: ["/backup/dump.sh"]
    environment:
      <<: *s3-env
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-splitsecond}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-splitsecond}
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ["sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256
    environment: *s3-env
    volumes:
      - s3data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-9100}:9000"

  create-bucket:
    image: splitsecond-postgres:dev
    pull_policy: never
    entrypoint: ["sh", "-c"]
    command:
      - |
        until s5cmd --endpoint-url "$$AWS_ENDPOINT" ls >/dev/null 2>&1; do sleep 2; done
        s5cmd --endpoint-url "$$AWS_ENDPOINT" ls "s3://$$S3_BUCKET" >/dev/null 2>&1 \
          || s5cmd --endpoint-url "$$AWS_ENDPOINT" mb "s3://$$S3_BUCKET"
    environment: *s3-env
    depends_on:
      - seaweedfs

  api:
    build: .
    image: splitsecond-api:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-splitsecond}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-splitsecond}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  test:
    image: splitsecond-api:dev
    pull_policy: never
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./backend:/app/backend:ro
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-splitsecond}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: ["python", "-m", "unittest", "discover", "-s", "backend/tests", "-v"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
