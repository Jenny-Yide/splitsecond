# Local HTTPS: a self-signed CA issues the Gateway certificate.
# DOKS defines a Let's Encrypt ClusterIssuer with the same name, so the Gateway manifest is shared.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: splitsecond-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: SplitSecond Local CA
  secretName: splitsecond-local-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: splitsecond-issuer
spec:
  ca:
    secretName: splitsecond-local-ca
