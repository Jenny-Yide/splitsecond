apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: splitsecond
  annotations:
    # Long-lived live-bill WebSockets; the app also pings every 30s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
