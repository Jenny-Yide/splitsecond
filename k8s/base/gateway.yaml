apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: splitsecond
  annotations:
    # Each cluster defines its own splitsecond-issuer (local CA on minikube, Let's Encrypt on DOKS).
    cert-manager.io/cluster-issuer: splitsecond-issuer
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https
      protocol: HTTPS
      port: 443
      # Overlays set the real hostname; cert-manager issues the certificate for it.
      hostname: splitsecond.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: splitsecond-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: splitsecond
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
spec:
  parentRefs:
    - name: splitsecond
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
