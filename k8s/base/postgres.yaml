apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        kubectl.kubernetes.io/default-container: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        # The image (docker/postgres) contains wal-g and applies schema.sql when the volume is empty.
        - name: postgres
          image: splitsecond-postgres
          args:
            - -c
            - archive_mode=on
            - -c
            - archive_command=wal-g wal-push %p
            # Force a WAL segment switch at least every 5 minutes: at most ~5 minutes of writes are unarchived.
            - -c
            - archive_timeout=300
          envFrom:
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: backup-s3
          env:
            # A subdirectory, because block storage volumes have lost+found at their root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        # wal-g base backups must read PGDATA, and the volume is ReadWriteOnce, so this runs in the same pod.
        - name: base-backup
          image: splitsecond-postgres
          command: ["/backup/base-backup.sh"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          envFrom:
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: backup-s3
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGHOST
              value: 127.0.0.1
            - name: PGUSER
              value: $(POSTGRES_USER)
            - name: PGPASSWORD
              value: $(POSTGRES_PASSWORD)
            - name: PGDATABASE
              value: $(POSTGRES_DB)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
