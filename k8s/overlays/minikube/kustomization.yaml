apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: splitsecond

resources:
  - ../../base
  - object-storage.yaml

# Build into minikube first:
#   minikube image build -t splitsecond-api:dev .
#   minikube image build -t splitsecond-postgres:dev -f docker/postgres/Dockerfile .
images:
  - name: splitsecond-api
    newTag: dev
  - name: splitsecond-postgres
    newTag: dev
